[General]

## Maximum number of enemies alive at the same time on the moon. Keep this at or below ~10-15 to preserve FPS.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 0 to 40
GlobalCap = 15

## Minimum delay between spawn attempts, in seconds.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 1 to 600
MinSpawnInterval = 1

## Maximum delay between spawn attempts, in seconds. Each cycle picks a random value in [Min, Max].
# Setting type: Single
# Default value: 45
# Acceptable value range: From 1 to 600
MaxSpawnInterval = 4

## If true, every landing on the Company moon despawns all existing enemies and spawning restarts from zero. If false, existing enemies are left alone and the spawner just tops up toward the configured limits.
# Setting type: Boolean
# Default value: true
RespawnOnLoad = true

## Verbose logging: timer intervals, alive counts, weighted-pick results, spawn errors.
# Setting type: Boolean
# Default value: false
DebugMode = true

[Integration]

## Percent chance (0-100) that a spawned Coil-Head or Manticoil gets a turret on its head via the ToilHead mod. Ignored when ToilHead is not installed.
# Setting type: Int32
# Default value: 25
# Acceptable value range: From 0 to 100
ToilHeadSpawnChance = 25

## Grows vain shrouds (weeds) on the Company moon by setting the level's own moldSpreadIterations, so the game generates and network-syncs them exactly like on any other moon. Required by the Kidnapper Fox (Bush Wolf), which despawns itself on spawn when there is nothing to hide in. 0 = automatic: weeds are grown only when Bush Wolf is enabled (12 iterations). Higher = more overgrowth.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 40
VainShroudIterations = 0

## Of the turret rolls that succeed, percent chance (0-100) the turret is the 'Slayer' (minigun) variant instead of a regular one.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 100
ToilSlayerChance = 5

