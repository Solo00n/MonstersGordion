## Settings file was created by plugin MonstersGordion v1.0.6
## Plugin GUID: Timofey.MonstersGordion

[Advanced]

## Despawn enemies created by this mod when the ship leaves the Company moon.
# Setting type: Boolean
# Default value: true
DespawnOnShipLeave = true

## If true, enemies spawned by the game or other mods (e.g. BrutalCompanyMinus events) count toward GlobalCap and per-type limits, so the mods share one budget instead of stacking on top of each other. If false, only enemies spawned by this mod are counted.
# Setting type: Boolean
# Default value: true
CountForeignEnemies = true

## Never spawn closer than this many meters to a player.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 60
MinDistanceFromPlayers = 12

## Small vertical offset applied to spawn points so enemies don't clip into the floor.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 2
SpawnYOffset = 0.25

## Number of AI patrol nodes generated on the interior navmesh for spawned enemies to roam between.
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 4 to 64
AINodeCount = 64

## Only accept navmesh points that have a ceiling above them (i.e. inside the building). Disable if the spawner reports it cannot find valid points.
# Setting type: Boolean
# Default value: true
RequireIndoorPoints = true

## Comma-separated list of additional EnemyType names to exclude from the pool entirely (on top of the built-in exclusions: Lasso, Red pill, Bush Wolf).
# Setting type: String
# Default value: 
ExcludedEnemies = Anti Coil-Head, Baboon hawk, Blob, Bunker Spider, Butler, Butler Bees, Centipede, Clay Surgeon, Crawler, Docile Locust Bees, Flowerman, ForestGiant, Girl, Hoarding bug, Jester, Maneater, Manticoil, MouthDog, NutSlayer, Nutcracker, Puffer, Red Locust Bees, Shiggy, Spring, Stingray, Tulip Snake, kamikazieBugs, masked

## REQUIRED for enemies to be able to see, chase and kill you. The game decides whether an enemy may target a player with 'player.isInsideFactory != enemy.isOutside'. Inside the Company building players are NOT flagged as being in a factory, so enemies must be flagged as outside enemies or they will walk past you and never attack. Only turn this off for debugging.
# Setting type: Boolean
# Default value: true
TreatEnemiesAsOutside = true

## How often (seconds) to re-apply AI settings to spawned enemies, rescue enemies that wandered somewhere unreachable, and apply the ForeignEnemies policy.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 1 to 30
MaintenanceInterval = 3

## What to do with enemies this mod did NOT spawn (vanilla spawns, BrutalCompanyMinus, MoreEnemies...). Ignore = leave them; RemoveExcluded = despawn types listed in ExcludedEnemies, so the blacklist applies to the whole moon no matter who spawned them; RemoveNotEnabled = also despawn any type with Enabled = false.
# Setting type: ForeignEnemyPolicy
# Default value: RemoveExcluded
# Acceptable values: Ignore, RemoveExcluded, RemoveNotEnabled
ForeignEnemies = RemoveExcluded

[Balance]

## Percent of spawn points placed on the upper level (at the ship landing height). The rest go to the lower level / basement. The basement floor is much larger, so pure area-weighted sampling would funnel almost everything down there.
# Setting type: Int32
# Default value: 70
# Acceptable value range: From 0 to 100
UpperFloorSpawnShare = 80

## Percent chance each spawn picks from OUTDOOR enemy types (dogs, giants, baboon hawks, Old Birds...) instead of indoor ones. Each pool only contains enemies you enabled; if the rolled pool is empty the other one is used. 50 = even split.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 0 to 100
OutsideEnemyShare = 49

